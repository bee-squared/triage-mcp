<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>TriageMCP architecture diagram</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 11.5px; fill: #475569; }
      .g { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: .04em; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .ln { stroke: #475569; stroke-width: 1.6; fill: none; }
      .api { stroke: #b45309; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="30" y="40" class="h">TriageMCP architecture</text>
  <text x="30" y="60" class="sub">MCP spec 2026-07-28 (stateless) · TypeScript · static fixture data · evals gate every change</text>

  <!-- Clients group -->
  <rect x="20" y="72" width="250" height="374" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="34" y="92" class="g">MCP CLIENTS</text>

  <rect x="30" y="100" width="230" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="45" y="126" class="t">Claude Desktop / Claude Code</text>
  <text x="45" y="146" class="s">local dev and dogfooding · stdio</text>

  <rect x="30" y="190" width="230" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="45" y="216" class="t">MCP Inspector</text>
  <text x="45" y="236" class="s">debugging + CI smoke test · stdio</text>

  <rect x="30" y="280" width="230" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="45" y="306" class="t">claude.ai custom connector</text>
  <text x="45" y="326" class="s">recruiter demo · Streamable HTTP</text>

  <rect x="30" y="370" width="230" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="45" y="396" class="t">Triage CLI agent</text>
  <text x="45" y="416" class="s">Claude API loop + MCP client</text>

  <!-- Vercel -->
  <rect x="300" y="280" width="170" height="64" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="314" y="306" class="t">Vercel (Hobby)</text>
  <text x="314" y="326" class="s">serverless /mcp, /health</text>

  <!-- Server group -->
  <rect x="520" y="70" width="320" height="375" rx="12" fill="#ecfdf5" stroke="#059669"/>
  <text x="536" y="92" class="g">TRIAGEMCP SERVER</text>

  <rect x="550" y="110" width="260" height="60" rx="8" fill="#ffffff" stroke="#059669"/>
  <text x="565" y="134" class="t">Transport adapters</text>
  <text x="565" y="154" class="s">stdio | HTTP · Host/Origin check</text>

  <rect x="550" y="195" width="260" height="60" rx="8" fill="#ffffff" stroke="#059669"/>
  <text x="565" y="219" class="t">MCP registration</text>
  <text x="565" y="239" class="s">8 tools · 2 resources · 1 prompt</text>

  <rect x="550" y="280" width="260" height="60" rx="8" fill="#ffffff" stroke="#059669"/>
  <text x="565" y="304" class="t">Domain query layer</text>
  <text x="565" y="324" class="s">pure functions: graph walk, search</text>

  <rect x="550" y="365" width="260" height="60" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="565" y="389" class="t">Fixture data (JSON)</text>
  <text x="565" y="409" class="s">base + scenarios · Zod-validated</text>

  <path class="ln" d="M680,170 L680,193" marker-end="url(#arr)"/>
  <path class="ln" d="M680,255 L680,278" marker-end="url(#arr)"/>
  <path class="ln" d="M680,340 L680,363" marker-end="url(#arr)"/>

  <!-- Client -> transport arrows -->
  <path class="ln" d="M260,125 L548,125" marker-end="url(#arr)"/>
  <path class="ln" d="M260,222 L490,222 L490,140 L548,140" marker-end="url(#arr)"/>
  <path class="ln" d="M260,312 L298,312" marker-end="url(#arr)"/>
  <path class="ln" d="M470,312 L510,312 L510,152 L548,152" marker-end="url(#arr)"/>
  <path class="ln" d="M260,402 L530,402 L530,165 L548,165" marker-end="url(#arr)"/>

  <!-- Claude API -->
  <rect x="870" y="470" width="200" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="885" y="494" class="t">Claude API</text>
  <text x="885" y="514" class="s">agent model + judge model</text>

  <path class="api" d="M180,434 L180,500 L868,500" marker-end="url(#arrB)"/>
  <text x="560" y="492" class="s">agent loop calls</text>

  <!-- Eval row -->
  <rect x="20" y="590" width="930" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="34" y="608" class="g">EVAL HARNESS + CI</text>

  <rect x="40" y="615" width="170" height="64" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="54" y="641" class="t">GitHub Actions</text>
  <text x="54" y="661" class="s">PRs, nightly · deploys</text>

  <rect x="250" y="615" width="200" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="264" y="641" class="t">Eval runner</text>
  <text x="264" y="661" class="s">cases + answer keys · 3 trials</text>

  <rect x="490" y="615" width="200" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="504" y="641" class="t">Scorers</text>
  <text x="504" y="661" class="s">deterministic + LLM judge</text>

  <rect x="730" y="615" width="200" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="744" y="641" class="t">Scorecard</text>
  <text x="744" y="661" class="s">HTML report · PR comment · badge</text>

  <path class="ln" d="M210,647 L248,647" marker-end="url(#arr)"/>
  <path class="ln" d="M450,647 L488,647" marker-end="url(#arr)"/>
  <path class="ln" d="M690,647 L728,647" marker-end="url(#arr)"/>

  <!-- runner drives the same CLI agent loop -->
  <path class="ln" d="M300,615 L300,550 L100,550 L100,436" marker-end="url(#arr)"/>
  <text x="108" y="566" class="s">runs same agent loop</text>

  <!-- judge -->
  <path class="api" d="M590,615 L590,570 L960,570 L960,532" marker-end="url(#arrB)"/>
  <text x="780" y="563" class="s">judge calls</text>

  <!-- Legend -->
  <rect x="870" y="100" width="200" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="884" y="122" class="g">KEY</text>
  <path class="ln" d="M884,144 L924,144" marker-end="url(#arr)"/>
  <text x="932" y="148" class="s">MCP / internal flow</text>
  <path class="api" d="M884,172 L924,172" marker-end="url(#arrB)"/>
  <text x="932" y="176" class="s">Claude API call</text>
</svg>
