# Git hooks (pnpm add -D lefthook && pnpm exec lefthook install)
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
